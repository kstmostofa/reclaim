name: Reclaim
options:
  bundleIdPrefix: io.github.kstmostofa
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
packages:
  ReclaimCore:
    path: Packages/ReclaimCore
targets:
  Reclaim:
    type: application
    platform: macOS
    sources:
      - App
    dependencies:
      - package: ReclaimCore
        product: ReclaimCore
      # The root helper ships inside the app and is copied to /Library/PrivilegedHelperTools when installed.
      - target: ReclaimHelper
        embed: true
        codeSign: false
        copy:
          destination: executables
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Reclaim
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: "MIT License"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.kstmostofa.reclaim
        PRODUCT_NAME: Reclaim
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ARCHS: "$(ARCHS_STANDARD)"
        ONLY_ACTIVE_ARCH[config=Debug]: YES
        ONLY_ACTIVE_ARCH[config=Release]: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        COMBINE_HIDPI_IMAGES: YES

  ReclaimHelper:
    type: tool
    platform: macOS
    sources:
      - Helper
    dependencies:
      - package: ReclaimCore
        product: ReclaimCore
    settings:
      base:
        PRODUCT_NAME: io.github.kstmostofa.reclaim.helper
        PRODUCT_BUNDLE_IDENTIFIER: io.github.kstmostofa.reclaim.helper
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        SKIP_INSTALL: YES
        ONLY_ACTIVE_ARCH[config=Debug]: YES
        ONLY_ACTIVE_ARCH[config=Release]: NO
